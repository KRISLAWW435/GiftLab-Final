<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="starBody" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="starGloss" x1="18" y1="6" x2="38" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#FEF3C7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="starShadow" x1="32" y1="30" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.52" />
    </linearGradient>
    <radialGradient id="starCore" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#FDE68A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Crisp outer contrast halo so the star shape pops on both light and dark browser tabs -->
  <polygon
    points="32,4 40.2,21.4 59.4,24.1 45.4,37.6 48.8,56.8 32,47.6 15.2,56.8 18.6,37.6 4.6,24.1 23.8,21.4"
    fill="#1E103C"
    stroke="#1E103C"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Faceted 5-point star body -->
  <polygon
    points="32,4 40.2,21.4 59.4,24.1 45.4,37.6 48.8,56.8 32,47.6 15.2,56.8 18.6,37.6 4.6,24.1 23.8,21.4"
    fill="url(#starBody)"
    stroke="#FFFBEB"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- Lit upper-left crystal facet -->
  <polygon
    points="32,4 23.8,21.4 4.6,24.1 18.6,37.6 32,32.5"
    fill="url(#starGloss)"
  />

  <!-- Shaded lower-right prism facet -->
  <polygon
    points="32,32.5 45.4,37.6 48.8,56.8 32,47.6"
    fill="url(#starShadow)"
  />

  <!-- Inner crystal facet lines -->
  <path
    d="M32 5.5V46.5M23.8 21.6L32 32.5L40.2 21.6M6 24.3L32 32.5L58 24.3M16 55.6L32 32.5L48 55.6"
    stroke="rgba(255,255,255,0.48)"
    stroke-width="1.1"
    stroke-linecap="round"
  />

  <!-- Radiant star core -->
  <circle cx="32" cy="32.5" r="10.5" fill="url(#starCore)" />
  <circle cx="32" cy="32.5" r="3.6" fill="#FFFFFF" />
</svg>
